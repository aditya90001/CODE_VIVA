[project]
name = "adaptive-github-project-evaluator"
version = "0.1.0"
description = "Adaptive AI GitHub project evaluator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.7.1",
  "httpx>=0.27.2",
  "faster-whisper>=1.1.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.3",
  "pytest>=8.3.5",
]

[tool.setuptools]
packages = ["backend.app"]

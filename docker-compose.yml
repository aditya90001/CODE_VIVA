version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: evaluator-postgres
    environment:
      POSTGRES_DB: evaluator
      POSTGRES_USER: evaluator
      POSTGRES_PASSWORD: evaluator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
